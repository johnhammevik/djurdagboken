
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Djurdagboken</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f8f4;
      color: #263b32;
    }

    header {
      background: #37775a;
      color: white;
      text-align: center;
      padding: 28px 16px;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 460px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      padding: 26px;
      border-radius: 18px;
      box-shadow: 0 5px 22px #00000010;
    }

    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #d4ddd5;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #37775a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #e5eee7;
      color: #263b32;
    }

    #message { line-height: 1.5; }

    [hidden] { display: none !important; }
    
select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #d4ddd5;
  border-radius: 10px;
  background: white;
  font-size: 16px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

.pet-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #e0e7e0;
  border-radius: 12px;
}

.pet-avatar {
  font-size: 32px;
}

.pet-info {
  flex: 1;
  min-width: 0;
}

.pet-info small {
  display: block;
  margin-top: 5px;
  color: #68776e;
}

.delete-pet {
  width: auto;
  margin: 0;
  padding: 9px;
  background: #f6e8e8;
  color: #8f3333;
  font-size: 13px;
}

  </style>
</head>

<body>

  <header>
    <h1>🐾 Djurdagboken</h1>
    <p>Allt om ditt husdjur på ett ställe</p>
  </header>

  <main>
    <section id="auth-section" class="panel">
      <h2>Välkommen!</h2>
      <p>Logga in eller skapa ett konto.</p>

      <form id="auth-form">
        <input
          id="email"
          type="email"
          placeholder="Din e-postadress"
          autocomplete="email"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Lösenord"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button type="submit">Logga in</button>

        <button
          id="register"
          class="secondary"
          type="button"
        >
          Skapa konto
        </button>
      </form>
    </section>

    
<section id="app-section" class="panel" hidden>

  <h2>🐾 Mina djur</h2>
  <p id="welcome"></p>

  <h3>Lägg till ett djur</h3>

  <form id="pet-form">

    <label for="pet-name">Djurets namn</label>
    <input
      id="pet-name"
      type="text"
      placeholder="Exempelvis Ozzy"
      maxlength="60"
      required
    >

    <label for="pet-species">Djurart</label>
    <select id="pet-species" required>
      <option value="Katt">🐱 Katt</option>
      <option value="Hund">🐶 Hund</option>
      <option value="Kanin">🐰 Kanin</option>
      <option value="Fågel">🐦 Fågel</option>
      <option value="Annat">🐾 Annat djur</option>
    </select>

    <label for="pet-birth">
      Födelsedatum (frivilligt)
    </label>
    <input id="pet-birth" type="date">

    <button type="submit">
      + Spara djur
    </button>

  </form>

  <h3>Min djurfamilj</h3>
  <div id="pet-list"></div>

  <button id="logout" class="secondary">
    Logga ut
  </button>

</section>


    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // Dessa två värden lägger vi in i steg 5.
    const supabaseUrl =
      "https://tadwwgulhilwhvgsjfja.supabase.co";

    const publishableKey =
      "sb_publishable_Lkr3niZRqwzf5FihqqNtaQ__qA-BbUw";

    const supabase = createClient(
      supabaseUrl,
      publishableKey
    );

    const authForm =
      document.getElementById("auth-form");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }


    
// ===== DJURDAGBOKEN: DJURPROFILER =====

const petForm = document.getElementById("pet-form");
const petList = document.getElementById("pet-list");

let shownUserId = null;

// Hämta användarens djur
async function loadPets() {
  const userId = shownUserId;
  if (!userId) return;

  const { data, error } = await supabase
    .from("pets")
    .select("id, name, species, birth_date")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  if (shownUserId !== userId) return;

  if (error) {
    showMessage("Kunde inte hämta djuren: " + error.message);
    return;
  }

  petList.replaceChildren();

  if (data.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "Du har inte lagt till några djur ännu.";
    petList.append(empty);
    return;
  }

  // Skapa ett kort för varje sparat djur
  data.forEach(pet => {
    const card = document.createElement("div");
    card.className = "pet-card";

    const avatar = document.createElement("span");
    avatar.className = "pet-avatar";

    const emojis = {
      "Katt": "🐱",
      "Hund": "🐶",
      "Kanin": "🐰",
      "Fågel": "🐦",
      "Annat": "🐾"
    };

    avatar.textContent = emojis[pet.species] || "🐾";

    const info = document.createElement("div");
    info.className = "pet-info";

    const name = document.createElement("strong");
    name.textContent = pet.name;

    const details = document.createElement("small");
    details.textContent = pet.species +
      (pet.birth_date ? " · Född " + pet.birth_date : "");

    info.append(name, details);

    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.className = "delete-pet";
    removeButton.textContent = "Ta bort";

    removeButton.addEventListener("click", async () => {
      if (!confirm("Vill du ta bort " + pet.name + "?")) {
        return;
      }

      const { error } = await supabase
        .from("pets")
        .delete()
        .eq("id", pet.id)
        .eq("user_id", userId);

      if (error) {
        showMessage("Fel: " + error.message);
      } else {
        showMessage(pet.name + " har tagits bort.");
        await loadPets();
      }
    });

    card.append(avatar, info, removeButton);
    petList.append(card);
  });
}

// Spara ett nytt djur
petForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!shownUserId) return;

  const name = document.getElementById("pet-name")
    .value.trim();

  const species = document.getElementById("pet-species")
    .value;

  const birthDate = document.getElementById("pet-birth")
    .value || null;

  if (!name) {
    showMessage("Du måste ange djurets namn.");
    return;
  }

  const saveButton = petForm.querySelector(
    'button[type="submit"]'
  );

  saveButton.disabled = true;
  showMessage("Sparar djuret...");

  try {
    const { error } = await supabase
      .from("pets")
      .insert({
        name: name,
        species: species,
        birth_date: birthDate
      });

    if (error) throw error;

    petForm.reset();
    showMessage(name + " har sparats!");

    await loadPets();

  } catch (error) {
    showMessage("Kunde inte spara: " + error.message);

  } finally {
    saveButton.disabled = false;
  }
});

    // Logga in
    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("Loggar in...");

      const { error } =
        await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

      showMessage(error ? error.message : "Välkommen!");
    });

    // Registrera konto
    document.getElementById("register")
      .addEventListener("click", async () => {
        if (!authForm.reportValidity()) return;

        showMessage("Skapar konto...");

        const { data, error } =
          await supabase.auth.signUp({
            email: emailInput.value.trim(),
            password: passwordInput.value,
            options: {
              emailRedirectTo:
                window.location.origin +
                window.location.pathname
            }
          });

        if (error) {
          showMessage(error.message);
        } else if (!data.session) {
          showMessage(
            "Kontrollera din e-post och bekräfta kontot."
          );
        } else {
          showMessage("Kontot är skapat!");
        }
      });

    // Logga ut
    document.getElementById("logout")
      .addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();
        if (error) showMessage(error.message);
        else showMessage("Du är utloggad.");
      });

    // Kontrollera om användaren är inloggad
    const { data: { user } } =
      await supabase.auth.getUser();

    
function showUser(user) {
  shownUserId = user?.id ?? null;

  document.getElementById("auth-section")
    .hidden = Boolean(user);

  document.getElementById("app-section")
    .hidden = !user;

  if (user) {
    document.getElementById("welcome")
      .textContent = "Inloggad som: " + user.email;

    // Hämta djuren efter inloggningen
    setTimeout(() => loadPets(), 0);
  } else {
    petList.replaceChildren();
  }
}

    
  // Visa användaren när sidan öppnas
  showUser(user);

  // Uppdatera sidan vid inloggning och utloggning
  supabase.auth.onAuthStateChange(
    (_event, session) => {
      showUser(session?.user ?? null);
    }
  );

  </script>

</body>
</html>
