
<!DOCTYPE html>

  <style>

select {

/* =================================
   DJURDAGBOKEN 4.0 - NY DESIGN
================================= */

body {
  background: #f3f6f1;
  color: #283d32;
  line-height: 1.5;
}

header {
  background: linear-gradient(
    135deg,
    #285c43,
    #579772
  );
  padding: 38px 16px 52px;
  border-radius: 0 0 28px 28px;
}

header h1 {
  font-size: clamp(28px, 5vw, 40px);
  letter-spacing: -1px;
}

header p {
  opacity: 0.9;
}

main {
  max-width: 980px;
  margin: -24px auto 45px;
  position: relative;
  padding: 0 16px;
}

.panel {
  border-radius: 24px;
  border: 1px solid #e2ebe3;
  padding: 24px;
  box-shadow: 0 12px 32px #183a2412;
}

#auth-section {
  max-width: 480px;
  margin: auto;
}

#profile-section {
  max-width: 680px;
  margin: auto;
}

h2, h3 {
  color: #285c43;
}

button {
  border-radius: 12px;
  font-weight: 600;
  transition: background 0.2s;
}

button:hover {
  filter: brightness(0.96);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #579772;
  outline-offset: 1px;
}

/* Formulär */

#pet-form {
  background: #f5faf5;
  padding: 20px;
  border: 1px solid #e0e9df;
  border-radius: 18px;
}

/* Djurlista */

#pet-list {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(230px, 1fr)
  );
  gap: 14px;
  margin-top: 18px;
}

.pet-card {
  flex-direction: column;
  align-items: flex-start;
  margin: 0;
  padding: 18px;
  border-radius: 18px;
  background: #fff;
  border: 1px solid #e0e9df;
  box-shadow: 0 4px 14px #00000008;
}

.pet-avatar {
  display: grid;
  place-items: center;
  width: 100px;
  height: 100px;
  border-radius: 20px;
  background: #e7f0e6;
  overflow: hidden;
  font-size: 45px;
}

.pet-avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pet-info {
  width: 100%;
}

.pet-info strong {
  font-size: 21px;
}

.open-profile {
  width: 100%;
  background: #e5f0e7;
  color: #285c43;
}

.delete-pet {
  align-self: flex-end;
  margin-top: 10px;
}

/* Profilbilder */

.photo-editor {
  text-align: center;
  background: #f5faf5;
  padding: 22px;
  border-radius: 18px;
  margin: 20px 0;
  border: 1px solid #e1ece1;
}

.profile-photo-avatar {
  width: 150px;
  height: 150px;
  margin: 0 auto 18px;
  border-radius: 50%;
  background: #deeadf;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 60px;
  border: 5px solid white;
  box-shadow: 0 5px 18px #00000015;
}

.profile-photo-avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-editor label {
  margin-bottom: 10px;
}

.photo-hint {
  font-size: 12px;
  color: #6c7b70;
}

/* Mobilanpassning */

@media (max-width: 600px) {
  main {
    margin-top: -20px;
  }

  .panel {
    padding: 18px;
  }

  #pet-list {
    grid-template-columns: 1fr;
  }

  .pet-card {
    padding: 16px;
  }

  .profile-photo-avatar {
    width: 130px;
    height: 130px;
  }
}

  </style>
</head>

<!-- DJURDAGBOKEN 3.0: EGEN DJURPROFIL -->

<section id="profile-section" class="panel" hidden>

  <button id="back-to-list"
    class="secondary" type="button">
    ← Till mina djur
  </button>

  <h2 id="profile-name"></h2>
  <p id="profile-summary"></p>

  
<!-- DJURDAGBOKEN 4.0: PROFILBILD -->

<div class="photo-editor">

  <div
    id="profile-photo-preview"

</div>

  <h3>Om mitt djur</h3>

  <form id="profile-form">

      type="text"
      id="profile-breed"

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    // Dessa två värden lägger vi in i steg 5.
    const supabaseUrl =
      "https://tadwwgulhilwhvgsjfja.supabase.co";

    const publishableKey =
      "sb_publishable_Lkr3niZRqwzf5FihqqNtaQ__qA-BbUw";

    const supabase = createClient(
      supabaseUrl,
      publishableKey
    );

    const authForm =
      document.getElementById("auth-form");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    function showMessage(text) {
      message.textContent = text;
    }


    
// ===== DJURDAGBOKEN: DJURPROFILER =====

const petForm = document.getElementById("pet-form");
const petList = document.getElementById("pet-list");

let shownUserId = null;

// Hämta användarens djur
async function loadPets() {
  const userId = shownUserId;
  if (!userId) return;

  const { data, error } = await supabase
    .from("pets")
    .select("id, name, species, birth_date, photo_path")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  if (shownUserId !== userId) return;

  if (error) {
    showMessage("Kunde inte hämta djuren: " + error.message);
    return;
  }

  petList.replaceChildren();

  if (data.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "Du har inte lagt till några djur ännu.";
    petList.append(empty);
    return;
  }

  // Skapa ett kort för varje sparat djur
  data.forEach(pet => {
    const card = document.createElement("div");
    card.className = "pet-card";

    const avatar = document.createElement("span");
    avatar.className = "pet-avatar";

    const emojis = {
      "Katt": "🐱",
      "Hund": "🐶",
      "Kanin": "🐰",
      "Fågel": "🐦",
      "Annat": "🐾"
    };

    avatar.textContent = emojis[pet.species] || "🐾";
    
showPetPhoto(
  avatar,
  pet.photo_path,
  emojis[pet.species] || "🐾"
);

    const info = document.createElement("div");
    info.className = "pet-info";

    const name = document.createElement("strong");
    name.textContent = pet.name;

    const details = document.createElement("small");
    details.textContent = pet.species +
      (pet.birth_date ? " · Född " + pet.birth_date : "");

    info.append(name, details);

    
// Knapp för att öppna djurets profil
const viewButton = document.createElement("button");

viewButton.type = "button";
viewButton.className = "open-profile";
viewButton.textContent = "Visa profil →";

viewButton.addEventListener("click", () => {
  openPetProfile(pet.id);
});

info.append(viewButton);


    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.className = "delete-pet";
    removeButton.textContent = "Ta bort";

    removeButton.addEventListener("click", async () => {
      if (!confirm("Vill du ta bort " + pet.name + "?")) {
        return;
      }

      const { error } = await supabase
        .from("pets")
        .delete()
        .eq("id", pet.id)
        .eq("user_id", userId);

      if (error) {
        showMessage("Fel: " + error.message);
      } else {
        showMessage(pet.name + " har tagits bort.");
        await loadPets();
      }
    });

    card.append(avatar, info, removeButton);
    petList.append(card);
  });
}

// Spara ett nytt djur
petForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!shownUserId) return;

  const name = document.getElementById("pet-name")
    .value.trim();

  const species = document.getElementById("pet-species")
    .value;

  const birthDate = document.getElementById("pet-birth")
    .value || null;

  if (!name) {
    showMessage("Du måste ange djurets namn.");
    return;
  }

  const saveButton = petForm.querySelector(
    'button[type="submit"]'
  );

  saveButton.disabled = true;
  showMessage("Sparar djuret...");

  try {
    const { error } = await supabase
      .from("pets")
      .insert({
        name: name,
        species: species,
        birth_date: birthDate
      });

    if (error) throw error;

    petForm.reset();
    showMessage(name + " har sparats!");

    await loadPets();

  } catch (error) {
    showMessage("Kunde inte spara: " + error.message);

  } finally {
    saveButton.disabled = false;
  }
});

    
// ===== DJURDAGBOKEN 4.0: VISA BILDER =====

async function showPetPhoto(holder, path, emoji = "🐾") {
  const userId = shownUserId;

  holder.dataset.photoPath = path || "";
  holder.textContent = emoji;

  if (!path || !userId) return;

  // Skapa en tillfällig bildadress
  const { data, error } = await supabase.storage
    .from("pet-photos")
    .createSignedUrl(path, 3600);

  if (
    error ||
    !data?.signedUrl ||
    shownUserId !== userId ||
    holder.dataset.photoPath !== path ||
    !holder.isConnected
  ) {
    if (error) console.error("Bildfel:", error.message);
    return;
  }

  const img = document.createElement("img");
  img.alt = "Djurets profilbild";
  img.loading = "lazy";

  img.onerror = () => {
    if (holder.dataset.photoPath === path) {
      holder.textContent = emoji;
    }
  };

  img.src = data.signedUrl;
  holder.replaceChildren(img);
}

    
// ===== DJURDAGBOKEN 3.0 =====

const profileSection =
  document.getElementById("profile-section");

const appSection =
  document.getElementById("app-section");

const profileForm =
  document.getElementById("profile-form");

let openPetId = null;

// Öppna ett djurs profil
async function openPetProfile(petId) {
  const userId = shownUserId;
  if (!userId) return;

  showMessage("Öppnar djurprofil...");

  const { data: pet, error } = await supabase
    .from("pets")
    .select(
  "id, name, species, birth_date, breed, sex, description, photo_path"
)
    .eq("id", petId)
    .eq("user_id", userId)
    .single();

  if (shownUserId !== userId) return;

  if (error) {
    showMessage("Kunde inte öppna: " + error.message);
    return;
  }

  openPetId = pet.id;

  document.getElementById("profile-name")
    .textContent = "🐾 " + pet.name;

  document.getElementById("profile-summary")
    .textContent = pet.species +
      (pet.birth_date
        ? " · Född " + pet.birth_date
        : "");

  document.getElementById("profile-breed")
    .value = pet.breed || "";

  document.getElementById("profile-sex")
    .value = pet.sex || "";

  document.getElementById("profile-description")
    .value = pet.description || "";

  appSection.hidden = true;
  profileSection.hidden = false;

showPetPhoto(
  document.getElementById("profile-photo-preview"),
  pet.photo_path,
  "🐾"
);


  showMessage("");
}

// Gå tillbaka till djurlistan
document.getElementById("back-to-list")
  .addEventListener("click", async () => {

    profileSection.hidden = true;
    appSection.hidden = false;
    openPetId = null;

    showMessage("");
    await loadPets();
  });

// Spara profilinformationen
profileForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const petId = openPetId;
  const userId = shownUserId;

  if (!petId || !userId) return;

  const saveButton = profileForm.querySelector(
    'button[type="submit"]'
  );

  saveButton.disabled = true;
  showMessage("Sparar profilen...");

  const breed =
    document.getElementById("profile-breed")
      .value.trim() || null;

  const sex =
    document.getElementById("profile-sex")
      .value || null;

  const description =
    document.getElementById("profile-description")
      .value.trim() || null;

  try {
    const { error } = await supabase
      .from("pets")
      .update({
        breed: breed,
        sex: sex,
        description: description
      })
      .eq("id", petId)
      .eq("user_id", userId)
      .select("id")
      .single();

    if (error) throw error;

    showMessage("Profilen är sparad! ✅");

  } catch (error) {
    showMessage(
      "Kunde inte spara: " + error.message
    );

  } finally {
    saveButton.disabled = false;
  }
});

    
// ===== LADDA UPP DJURETS BILD =====

document.getElementById("upload-photo")
  .addEventListener("click", async () => {

    const input =
      document.getElementById("profile-photo");

    const file = input.files[0];
    const petId = openPetId;
    const userId = shownUserId;

    if (!file) {
      showMessage("Välj en bild först.");
      return;
    }

    if (!petId || !userId) {
      showMessage("Öppna en djurprofil först.");
      return;
    }

    // Tillåt bara vanliga bildformat
    const extensions = {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp"
    };

    const extension = extensions[file.type];

    if (!extension) {
      showMessage("Använd JPG, PNG eller WebP.");
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      showMessage("Bilden får vara högst 5 MB.");
      return;
    }

    const button =
      document.getElementById("upload-photo");

    button.disabled = true;
    showMessage("Laddar upp bilden...");

    // Varje bild får ett unikt filnamn
    const path =
      `${userId}/${petId}/${crypto.randomUUID()}.${extension}`;

    try {
      // 1. Ladda upp till privat bildlagring
      const { error: uploadError } =
        await supabase.storage
          .from("pet-photos")
          .upload(path, file, {
            contentType: file.type,
            upsert: false
          });

      if (uploadError) throw uploadError;

      if (shownUserId !== userId || openPetId !== petId) {
        throw new Error("Djurprofilen har ändrats.");
      }

      // 2. Koppla bilden till rätt djur
      const { error: saveError } = await supabase
        .from("pets")
        .update({ photo_path: path })
        .eq("id", petId)
        .eq("user_id", userId)
        .select("id")
        .single();

      if (saveError) throw saveError;

      // 3. Visa den nya bilden
      await showPetPhoto(
        document.getElementById("profile-photo-preview"),
        path,
        "🐾"
      );

      input.value = "";
      showMessage("Profilbilden är sparad! ✅");

    } catch (error) {
      showMessage(
        "Kunde inte spara bilden: " + error.message
      );

    } finally {
      button.disabled = false;
    }
  });

    
    // Logga in
    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("Loggar in...");

      const { error } =
        await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value
        });

      showMessage(error ? error.message : "Välkommen!");
    });

    // Registrera konto
    document.getElementById("register")
      .addEventListener("click", async () => {
        if (!authForm.reportValidity()) return;

        showMessage("Skapar konto...");

        const { data, error } =
          await supabase.auth.signUp({
            email: emailInput.value.trim(),
            password: passwordInput.value,
            options: {
              emailRedirectTo:
                window.location.origin +
                window.location.pathname
            }
          });

        if (error) {
          showMessage(error.message);
        } else if (!data.session) {
          showMessage(
            "Kontrollera din e-post och bekräfta kontot."
          );
        } else {
          showMessage("Kontot är skapat!");
        }
      });

    // Logga ut
    document.getElementById("logout")
      .addEventListener("click", async () => {
        const { error } = await supabase.auth.signOut();
        if (error) showMessage(error.message);
        else showMessage("Du är utloggad.");
      });

    // Kontrollera om användaren är inloggad
    const { data: { user } } =
      await supabase.auth.getUser();

    
function showUser(user) {
  shownUserId = user?.id ?? null;

  if (!user) {
    profileSection.hidden = true;
    openPetId = null;
  }

  document.getElementById("auth-section")
    .hidden = Boolean(user);

  document.getElementById("app-section")
    .hidden = !user;

  if (user) {
    document.getElementById("welcome")
      .textContent = "Inloggad som: " + user.email;

    // Hämta djuren efter inloggningen
    setTimeout(() => loadPets(), 0);
  } else {
    petList.replaceChildren();
  }
}

    
  // Visa användaren när sidan öppnas
  showUser(user);

  // Uppdatera sidan vid inloggning och utloggning
  supabase.auth.onAuthStateChange(
    (_event, session) => {
      showUser(session?.user ?? null);
    }
  );

  </script>
